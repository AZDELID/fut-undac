<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}FUT-UNDAC{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="{{ url_for('static', filename='img/undac_logo.jpg') }}" alt="UNDAC">
      <div>
        <h1>FUT-UNDAC</h1>
        <span>Formulario Único de Trámite</span>
      </div>
    </div>
    <div class="menu-label">MENÚ</div>
    <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint=='index' %}active{% endif %}">🏠 Inicio</a>
    <a href="{{ url_for('index') }}" class="nav-item">📋 Mis Trámites</a>
    <a href="{{ url_for('index') }}" class="nav-item">👤 Mi Perfil</a>
    <div class="version">v2.0 — UNDAC 2026 · web</div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
